name: refresh
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * 1"  # Mondays 09:00 UTC

permissions:
  contents: write

jobs:
  run-etl:
    runs-on: ubuntu-latest
    env:
      HOSPITAL_CSV_URL: ${{ vars.HOSPITAL_CSV_URL }}
      OUTCOMES_CSV_URL: ${{ vars.OUTCOMES_CSV_URL }}
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Show branch & tree
        run: |
          echo "Branch => $GITHUB_REF_NAME"
          ls -la
          echo "--- repo tree ---"
          ls -R

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -V
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pandas requests streamlit sodapy pyarrow duckdb

      - name: Ensure folders exist
        run: |
          mkdir -p data_clean data_raw
          ls -la data_clean || true
          ls -la data_raw || true

      - name: Check token presence
        run: |
          if [ -n "${SOCRATA_APP_TOKEN}" ]; then
            echo "SOCRATA_APP_TOKEN is set ✅"
          else
            echo "SOCRATA_APP_TOKEN is NOT set ❌ (that's fine for CDC/ACS)"
          fi

      #################################################################
      # Try CMS fetch (best effort, do not fail the run if CMS doesn't cooperate).
      #################################################################
      - name: Try CMS fetch (best effort; tolerate failure)
        shell: bash
        run: |
          set +e  # don't kill the job if this block fails
          python - << 'PY'
          import json, os, time, random, requests, pathlib

          RAW = pathlib.Path("data_raw"); RAW.mkdir(parents=True, exist_ok=True)

          hosp_pin = os.environ.get("HOSPITAL_CSV_URL") or ""
          out_pin  = os.environ.get("OUTCOMES_CSV_URL") or ""

          def http_get(url, headers, timeout=20, retries=4, sleep_base=1.0):
            for i in range(retries):
              try:
                r = requests.get(url, timeout=timeout, headers=headers, allow_redirects=True)
                if r.status_code in (200,206):
                  return r
                if r.status_code in (429,500,502,503,504):
                  t = sleep_base*(2**i) + random.uniform(0,0.6)
                  time.sleep(t); continue
                return r
              except requests.exceptions.RequestException:
                t = sleep_base*(2**i) + random.uniform(0,0.6)
                time.sleep(t)
            return None

          def download_full(url, dest_name):
            if not url:
              return False
            headers={"User-Agent":"github-actions/etl","Accept":"text/csv, */*"}
            r=http_get(url, headers, timeout=240, retries=5, sleep_base=1.5)
            if not r:
              print(f"[CMS] Could not download {url}")
              return False
            ct=(r.headers.get("Content-Type","") or "").lower()
            if r.status_code!=200 or "csv" not in ct or len(r.content)<200:
              print(f"[CMS] Bad content for {url} -> {r.status_code}/{ct}, size={len(r.content)}")
              return False
            out_path = RAW/dest_name
            with open(out_path,"wb") as w: w.write(r.content)
            print(f"[CMS] Wrote {out_path} ({len(r.content)} bytes)")
            return True

          got_hosp = download_full(hosp_pin, "cms_hospital_info_export.csv")
          got_out  = download_full(out_pin , "cms_outcomes_export.csv")

          if not (got_hosp and got_out):
            print("[CMS] best-effort mode: either we have no pinned URLs yet or CMS blocked us.")
            print("[CMS] We'll keep going with CDC + ACS, and build county profile regardless.")
          PY
          echo "[CMS] fetch step finished (errors ignored)"
          set -e

      #################################################################
      # CDC stroke mortality + ACS uninsured
      #################################################################
      - name: Run CDC county
        run: python etl/fetch_cdc_stroke_county.py

      - name: Run ACS uninsured
        run: python etl/fetch_acs_uninsured.py

      #################################################################
      # Build clean tables
      #################################################################
      - name: Build clean tables
        run: python etl/build_clean_tables.py

      - name: Fetch population data
        run: python etl/fetch_population_county.py

      - name: Build care gap index
        run: python etl/build_care_gap_index.py

      - name: Generate ranked results
        run: python etl/analyze_care_gap_results.py

      - name: List outputs
        run: |
          echo "::group::data_clean"
          ls -la data_clean || true
          for f in data_clean/*.csv; do
            [ -f "$f" ] && echo "--- $(basename "$f") (first 5 lines) ---" && head -n 5 "$f";
          done
          echo "::endgroup::"
          echo "::group::data_raw"
          ls -la data_raw || true
          for f in data_raw/*.csv; do
            [ -f "$f" ] && echo "--- $(basename "$f") (first 5 lines) ---" && head -n 5 "$f";
          done
          echo "::endgroup::"

      - name: Smoke write (prove we can commit)
        shell: bash
        run: |
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data_clean/_smoke_commit.txt

      - name: Git status before commit
        run: |
          git status
          git ls-files --others --exclude-standard

      - name: Commit artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data_raw data_clean || true
          git commit -m "Auto-refresh data" || echo "No changes to commit"
          git push || echo "WARN: git push failed (likely branch protection/permissions)"

      - name: Upload data_clean as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data_clean
          path: data_clean

      - name: Upload data_raw as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data_raw
          path: data_raw
