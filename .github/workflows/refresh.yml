name: refresh
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * 1"  # Mondays 09:00 UTC

permissions:
  contents: write

jobs:
  run-etl:
    runs-on: ubuntu-latest
    env:
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Show branch & tree
        run: |
          echo "Branch => $GITHUB_REF_NAME"
          ls -la
          echo "--- repo tree ---"
          ls -R

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -V
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pandas requests streamlit sodapy pyarrow duckdb

      - name: Ensure folders exist
        run: |
          mkdir -p data_clean data_raw
          ls -la data_clean || true
          ls -la data_raw || true

      - name: Check token presence
        run: |
          if [ -n "${SOCRATA_APP_TOKEN}" ]; then
            echo "SOCRATA_APP_TOKEN is set ✅"
          else
            echo "SOCRATA_APP_TOKEN is NOT set ❌ (that's okay for CSV export)"
          fi

      # ---------- robust resolver: find candidates, validate headers, then download full CSVs ----------
      - name: Resolve & download CMS CSVs (header-validated)
        shell: bash
        run: |
          set -e
          python - << 'PY'
          import json, sys, requests, re, csv, io, os

          CAT = "https://data.cms.gov/data.json"
          H_POS = ["hospital","general","information","care compare","provider data catalog","facility","address","ccn","provider id","zip","city","state"]
          H_NEG = ["ownership","associate","enrollment","pecos","owner","investor","enforcement","action","deficiency","survey","inspection"]
          O_POS = ["complications","deaths","mortality","outcome","readmission","measure","hospital","care compare"]
          O_NEG = ["ownership","associate","enrollment","pecos","enforcement","action"]

          def score_pos(t,keys): 
              t=(t or "").lower(); return sum(2 for k in keys if k in t)
          def score_neg(t,keys):
              t=(t or "").lower(); return sum(3 for k in keys if k in t)

          def candidates_for(item, pos, neg, url_hints=None):
              title=item.get("title","") or ""
              desc =item.get("description","") or ""
              base =score_pos(title,pos)+score_pos(desc,pos)-score_neg(title,neg)-score_neg(desc,neg)
              out=[]
              for d in item.get("distribution",[]) or []:
                  if d.get("mediaType")!="text/csv": 
                      continue
                  url=d.get("downloadURL") or ""
                  s=base + score_pos(url,pos)-score_neg(url,neg)
                  if url_hints:
                      for rx,bonus in url_hints:
                          if re.search(rx,url,re.I): s+=bonus
                  out.append((s,url,title))
              return out

          print("Fetching CMS catalog …")
          r=requests.get(CAT,timeout=180); r.raise_for_status()
          ds=r.json().get("dataset",[])
          cand_h=[]; cand_o=[]
          HINTS_H=[(r"hospital[-_]general[-_]information",10),(r"care[-_]compare.*hospital",6)]
          HINTS_O=[(r"complications.*deaths.*hospital",10),(r"hospital.*complications",6),(r"mortality.*hospital",6)]
          for it in ds:
              cand_h += candidates_for(it,H_POS,H_NEG,HINTS_H)
              cand_o += candidates_for(it,O_POS,O_NEG,HINTS_O)

          cand_h = sorted(cand_h, key=lambda x: -x[0])[:20]
          cand_o = sorted(cand_o, key=lambda x: -x[0])[:20]
          print("Top hospital candidates:", [t for _,_,t in cand_h[:5]])
          print("Top outcomes candidates:", [t for _,_,t in cand_o[:5]])

          headers = {"User-Agent":"github-actions/etl","Accept":"text/csv, */*"}
          os.makedirs("data_raw",exist_ok=True)

          def first_line(url):
              r = requests.get(url, timeout=120, headers=headers, allow_redirects=True)
              ct=(r.headers.get("Content-Type","") or "").lower()
              if r.status_code!=200 or "csv" not in ct:
                  return None, f"bad status/type {r.status_code}/{ct}"
              chunk = r.content.splitlines()[0:1]
              if not chunk: return None, "no bytes"
              try:
                  text = chunk[0].decode("utf-8", errors="replace")
              except Exception:
                  text = chunk[0].decode("latin1","replace")
              return text.strip(), None

          def looks_like_directory(header):
              h = (header or "").lower()
              return any(k in h for k in ["ccn","provider id","facility id"]) or \
                     (("hospital" in h or "provider" in h) and ("address" in h) and ("city" in h) and ("state" in h))

          def looks_like_outcomes(header):
              h=(header or "").lower()
              return any(k in h for k in ["measure_id","measure id","measure_name","measure name","condition","topic"]) \
                     or ("readmission" in h or "mortality" in h or "complication" in h)

          def download(url, dest):
              r=requests.get(url, timeout=600, headers=headers, allow_redirects=True)
              ct=(r.headers.get("Content-Type","") or "").lower()
              if r.status_code!=200 or "csv" not in ct or len(r.content)<200:
                  raise RuntimeError(f"download failed {r.status_code}/{ct}, size={len(r.content)}")
              with open(dest,"wb") as w: w.write(r.content)
              print(f"Wrote {dest} ({len(r.content)} bytes)")

          # pick hospital directory
          hosp_url=None
          for _,url,title in cand_h:
              line, err = first_line(url)
              print("Try HOSP:", title, "->", url, "| first line ok?", err is None)
              if line and looks_like_directory(line):
                  hosp_url = url
                  print("Selected HOSP by header ✅:", line[:200])
                  break
          if not hosp_url:
              print("ERROR: no hospital directory candidate passed header check"); sys.exit(1)

          # pick outcomes
          out_url=None
          for _,url,title in cand_o:
              line, err = first_line(url)
              print("Try OUT :", title, "->", url, "| first line ok?", err is None)
              if line and looks_like_outcomes(line):
                  out_url = url
                  print("Selected OUT by header ✅:", line[:200])
                  break
          if not out_url:
              print("ERROR: no outcomes candidate passed header check"); sys.exit(1)

          # download full CSVs
          download(hosp_url, "data_raw/cms_hospital_info_export.csv")
          download(out_url , "data_raw/cms_outcomes_export.csv")

          # stash chosen URLs for visibility
          with open("data_raw/_cms_download_urls.json","w") as f:
              json.dump({"hospital_csv":hosp_url,"outcomes_csv":out_url}, f)
          PY

      # ---------- copy hospital directory if non-empty & looks right ----------
      - name: Copy hospital export to clean (directory only)
        shell: bash
        run: |
          set -e
          if [ ! -s data_raw/cms_hospital_info_export.csv ]; then
            echo "ERROR: hospital export empty"; exit 1
          fi
          header="$(head -n 1 data_raw/cms_hospital_info_export.csv | tr '[:upper:]' '[:lower:]')"
          echo "Hospital header: $header"
          if echo "$header" | grep -E -q "ccn|provider id|facility id|hospital name"; then
            cp data_raw/cms_hospital_info_export.csv data_clean/cms_hospital_info.csv
            echo "Copied hospital directory CSV to data_clean/"
          else
            echo "ERROR: hospital file doesn't look like the directory table"; exit 1
          fi

      # ---------- make stroke-only outcomes (robust encoding) ----------
      - name: Filter outcomes to stroke-only (robust encoding)
        shell: bash
        run: |
          set -e
          if [ ! -s data_raw/cms_outcomes_export.csv ]; then
            echo "ERROR: outcomes export missing or empty"; exit 1
          fi
          python - << 'PY'
          import os
          from io import StringIO
          from pathlib import Path
          import pandas as pd

          src = Path("data_raw/cms_outcomes_export.csv")
          dst = Path("data_clean/cms_stroke_outcomes.csv")
          os.makedirs("data_clean", exist_ok=True)

          def read_csv_robust(path: Path) -> pd.DataFrame:
            for enc in ("utf-8","utf-8-sig","latin1","cp1252"):
              try:
                return pd.read_csv(path, dtype=str, low_memory=False, encoding=enc)
              except UnicodeDecodeError:
                print(f"Decode failed with {enc}; trying next …")
            with open(path, "rb") as f:
              text = f.read().decode("utf-8", errors="replace")
            return pd.read_csv(StringIO(text), dtype=str, low_memory=False)

          df = read_csv_robust(src)
          if df.empty:
            print("ERROR: outcomes export read empty"); raise SystemExit(1)

          df.columns = [c.strip().lower() for c in df.columns]
          print("Outcome columns (first 30):", df.columns.tolist()[:30])

          # Find stroke rows across likely columns
          cols_try = [
            "measure_id","measure id","measure_name","measure name",
            "condition","condition name","clinical condition","topic","topic name","category"
          ]
          mask = None
          for c in cols_try:
            if c in df.columns:
              m = df[c].astype(str).str.lower().str.contains("stroke", na=False)
              mask = m if mask is None else (mask | m)
          if mask is None:
            mask = pd.Series(False, index=df.index)
            for c in df.columns:
              if df[c].dtype == object:
                mask = mask | df[c].astype(str).str.lower().str.contains("stroke", na=False)

          df_stk = df.loc[mask].copy()
          print("Stroke rows:", int(mask.sum()))
          df_stk.to_csv(dst, index=False)
          PY

      # ---------- CDC + ACS + build joins ----------
      - name: Run CDC county
        run: python etl/fetch_cdc_stroke_county.py

      - name: Run ACS uninsured
        run: python etl/fetch_acs_uninsured.py

      - name: Build clean tables
        run: python etl/build_clean_tables.py

      - name: List outputs
        run: |
          echo "::group::data_clean"
          ls -la data_clean || true
          for f in data_clean/*.csv; do
            [ -f "$f" ] && echo "--- $(basename "$f") (first 5 lines) ---" && head -n 5 "$f";
          done
          echo "::endgroup::"
          echo "::group::data_raw"
          ls -la data_raw || true
          for f in data_raw/*.csv; do
            [ -f "$f" ] && echo "--- $(basename "$f") (first 5 lines) ---" && head -n 5 "$f";
          done
          echo "::endgroup::"

      - name: Smoke write (prove we can commit)
        shell: bash
        run: |
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data_clean/_smoke_commit.txt

      - name: Git status before commit
        run: |
          git status
          git ls-files --others --exclude-standard

      - name: Commit artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data_raw data_clean || true
          git commit -m "Auto-refresh data" || echo "No changes to commit"
          git push || echo "WARN: git push failed (likely branch protection/permissions)"

      - name: Upload data_clean as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data_clean
          path: data_clean

      - name: Upload data_raw as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data_raw
          path: data_raw
