name: refresh
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * 1"  # Mondays 09:00 UTC

permissions:
  contents: write

jobs:
  run-etl:
    runs-on: ubuntu-latest
    env:
      # Optional future optimization:
      # You can go to Settings → Variables and add these to hard-pin URLs
      # if we ever capture them from CMS manually:
      HOSPITAL_CSV_URL: ${{ vars.HOSPITAL_CSV_URL }}
      OUTCOMES_CSV_URL: ${{ vars.OUTCOMES_CSV_URL }}

      # CDC/ACS doesn’t require this, but we keep it in case CMS throttles:
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Show branch & tree
        run: |
          echo "Branch => $GITHUB_REF_NAME"
          ls -la
          echo "--- repo tree ---"
          ls -R

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -V
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pandas requests streamlit sodapy pyarrow duckdb

      - name: Ensure folders exist
        run: |
          mkdir -p data_clean data_raw
          ls -la data_clean || true
          ls -la data_raw || true

      - name: Check token presence
        run: |
          if [ -n "${SOCRATA_APP_TOKEN}" ]; then
            echo "SOCRATA_APP_TOKEN is set ✅"
          else
            echo "SOCRATA_APP_TOKEN is NOT set ❌ (that's fine for CDC/ACS)"
          fi

      #################################################################
      # TRY to grab CMS hospital directory + outcomes.
      # If CMS rate-limits us or hides URLs, we DO NOT FAIL THE JOB.
      #################################################################
      - name: Try CMS fetch (best effort; tolerate failure)
        shell: bash
        run: |
          set +e  # don't kill the job if this block fails
          python - << 'PY'
          import json, os, re, sys, time, random, requests, pathlib

          RAW = pathlib.Path("data_raw"); RAW.mkdir(parents=True, exist_ok=True)

          hosp_pin = os.environ.get("HOSPITAL_CSV_URL") or ""
          out_pin  = os.environ.get("OUTCOMES_CSV_URL") or ""

          def http_get(url, headers, timeout=20, retries=4, sleep_base=1.0):
            for i in range(retries):
              try:
                r = requests.get(url, timeout=timeout, headers=headers, allow_redirects=True)
                if r.status_code in (200,206):
                  return r
                if r.status_code in (429,500,502,503,504):
                  t = sleep_base*(2**i) + random.uniform(0,0.6)
                  time.sleep(t); continue
                return r
              except requests.exceptions.RequestException:
                t = sleep_base*(2**i) + random.uniform(0,0.6)
                time.sleep(t)
            return None

          def download_full(url, dest_name):
            if not url:
              return False
            headers={"User-Agent":"github-actions/etl","Accept":"text/csv, */*"}
            r=http_get(url, headers, timeout=240, retries=5, sleep_base=1.5)
            if not r:
              print(f"[CMS] Could not download {url}")
              return False
            ct=(r.headers.get("Content-Type","") or "").lower()
            if r.status_code!=200 or "csv" not in ct or len(r.content)<200:
              print(f"[CMS] Bad content for {url} -> {r.status_code}/{ct}, size={len(r.content)}")
              return False
            out_path = RAW/dest_name
            with open(out_path,"wb") as w: w.write(r.content)
            print(f"[CMS] Wrote {out_path} ({len(r.content)} bytes)")
            return True

          # If you eventually set repo Variables for HOSPITAL_CSV_URL and OUTCOMES_CSV_URL,
          # this will just grab those exact files.
          got_hosp = download_full(hosp_pin, "cms_hospital_info_export.csv")
          got_out  = download_full(out_pin , "cms_outcomes_export.csv")

          if not (got_hosp and got_out):
            print("[CMS] best-effort mode: either we have no pinned URLs yet or CMS blocked us.")
            print("[CMS] That's okay. We'll keep going with CDC + ACS for county profiles.")
          PY
          echo "[CMS] fetch step finished (errors ignored)"
          set -e

      #################################################################
      # Copy the hospital directory CSV, IF it exists and looks ok.
      #################################################################
      - name: Copy hospital export to clean (if valid)
        shell: bash
        run: |
          # don't fail if missing
          if [ -s data_raw/cms_hospital_info_export.csv ]; then
            header="$(head -n 1 data_raw/cms_hospital_info_export.csv | tr '[:upper:]' '[:lower:]')"
            echo "hospital header -> $header"
            if echo "$header" | grep -E -q "ccn|facility id|provider id|hospital name"; then
              cp data_raw/cms_hospital_info_export.csv data_clean/cms_hospital_info.csv
              echo "copied hospital info to data_clean/cms_hospital_info.csv"
            else
              echo "hospital file present but header looked weird, skipping copy"
            fi
          else
            echo "no cms_hospital_info_export.csv found, skipping"
          fi

      #################################################################
      # Filter CMS outcomes down to stroke-only if we have it.
      #################################################################
      - name: Filter outcomes to stroke-only (robust encoding; skip if missing)
        shell: bash
        run: |
          if [ -s data_raw/cms_outcomes_export.csv ]; then
            python - << 'PY'
            import os
            from io import StringIO
            from pathlib import Path
            import pandas as pd

            src = Path("data_raw/cms_outcomes_export.csv")
            dst = Path("data_clean/cms_stroke_outcomes.csv")
            os.makedirs("data_clean", exist_ok=True)

            def read_csv_robust(path: Path) -> pd.DataFrame:
              for enc in ("utf-8","utf-8-sig","latin1","cp1252"):
                try:
                  return pd.read_csv(path, dtype=str, low_memory=False, encoding=enc)
                except UnicodeDecodeError:
                  print(f"Decode failed with {enc}; trying next …")
              with open(path, "rb") as f:
                text = f.read().decode("utf-8", errors="replace")
              return pd.read_csv(StringIO(text), dtype=str, low_memory=False)

            df = read_csv_robust(src)
            if df.empty:
              print("cms_outcomes_export.csv read as empty, will just create blank stroke file")
              pd.DataFrame().to_csv(dst, index=False)
            else:
              df.columns = [c.strip().lower() for c in df.columns]
              # stroke filter: look for 'stroke' anywhere in measure columns
              cols_try = [
                "measure_id","measure id","measure_name","measure name",
                "condition","condition name","clinical condition","topic","topic name","category"
              ]
              mask = None
              for c in cols_try:
                if c in df.columns:
                  m = df[c].astype(str).str.lower().str.contains("stroke", na=False)
                  mask = m if mask is None else (mask | m)
              if mask is None:
                mask = pd.Series(False, index=df.index)
                for c in df.columns:
                  if df[c].dtype == object:
                    mask = mask | df[c].astype(str).str.lower().str.contains("stroke", na=False)

              df_stk = df.loc[mask].copy()
              print("rows mentioning stroke:", int(mask.sum()))
              df_stk.to_csv(dst, index=False)
            PY
          else
            echo "no cms_outcomes_export.csv found, skipping stroke filter"
          fi

      #################################################################
      # CDC stroke mortality + ACS uninsured (these already work)
      #################################################################
      - name: Run CDC county
        run: python etl/fetch_cdc_stroke_county.py

      - name: Run ACS uninsured
        run: python etl/fetch_acs_uninsured.py

      #################################################################
      # Build clean tables (this will now ALWAYS produce county_profile.csv)
      #################################################################
      - name: Build clean tables
        run: python etl/build_clean_tables.py

      - name: List outputs
        run: |
          echo "::group::data_clean"
          ls -la data_clean || true
          for f in data_clean/*.csv; do
            [ -f "$f" ] && echo "--- $(basename "$f") (first 5 lines) ---" && head -n 5 "$f";
          done
          echo "::endgroup::"
          echo "::group::data_raw"
          ls -la data_raw || true
          for f in data_raw/*.csv; do
            [ -f "$f" ] && echo "--- $(basename "$f") (first 5 lines) ---" && head -n 5 "$f";
          done
          echo "::endgroup::"

      - name: Smoke write (prove we can commit)
        shell: bash
        run: |
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data_clean/_smoke_commit.txt

      - name: Git status before commit
        run: |
          git status
          git ls-files --others --exclude-standard

      - name: Commit artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data_raw data_clean || true
          git commit -m "Auto-refresh data" || echo "No changes to commit"
          git push || echo "WARN: git push failed (likely branch protection/permissions)"

      - name: Upload data_clean as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data_clean
          path: data_clean

      - name: Upload data_raw as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data_raw
          path: data_raw
